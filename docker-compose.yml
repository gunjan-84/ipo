services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped

  server:
    build: ./server
    environment:
      - PORT=4000
      - ACCOUNTS_ENC_KEY=${ACCOUNTS_ENC_KEY:-ipo-dashboard-dev-secret}
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Kolkata
    volumes:
      - ./server/data:/app/data
      - ./server/logs:/app/logs
    depends_on:
      - redis
    expose:
      - "4000"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5050:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis_data:
